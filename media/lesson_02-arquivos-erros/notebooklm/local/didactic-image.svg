<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <text x="40" y="28" font-size="14" font-weight="500" fill="#1f2933">Dois leitores, dois formatos de retorno</text>

  <rect x="40" y="56" width="180" height="196" rx="8" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="0.5"/>
  <text x="56" y="76" font-size="12" font-weight="500" fill="#1f2933">dados.csv</text>
  <text x="56" y="100" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" fill="#1f2933">nome,email,telefone</text>
  <text x="56" y="118" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" fill="#b45309">Ana,ana@exemplo.com,11…</text>
  <text x="56" y="136" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" fill="#1f2933">Bruno,bruno@exemplo.com,21…</text>
  <text x="56" y="168" font-size="10" fill="#6b7280">a 1ª linha é o cabeçalho:</text>
  <text x="56" y="182" font-size="10" fill="#6b7280">o nome das colunas,</text>
  <text x="56" y="196" font-size="10" fill="#6b7280">não um registro</text>
  <text x="56" y="224" font-size="10" fill="#6b7280">todo valor chega</text>
  <text x="56" y="238" font-size="10" fill="#6b7280">como texto (str)</text>

  <line x1="226" y1="100" x2="286" y2="88" stroke="#6b7280" stroke-width="1" marker-end="url(#seta)"/>
  <line x1="226" y1="150" x2="286" y2="212" stroke="#6b7280" stroke-width="1" marker-end="url(#seta)"/>

  <rect x="292" y="70" width="146" height="36" rx="8" fill="#eef4fa" stroke="#1e5f9e" stroke-width="0.5"/>
  <text x="365" y="92" font-size="12" fill="#1f2933" text-anchor="middle">csv.reader</text>
  <rect x="292" y="194" width="146" height="36" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="0.5"/>
  <text x="365" y="216" font-size="12" fill="#1f2933" text-anchor="middle">csv.DictReader</text>

  <line x1="442" y1="88" x2="474" y2="88" stroke="#6b7280" stroke-width="1" marker-end="url(#seta)"/>
  <line x1="442" y1="212" x2="474" y2="212" stroke="#6b7280" stroke-width="1" marker-end="url(#seta)"/>

  <rect x="480" y="58" width="160" height="60" rx="8" fill="#eef4fa" stroke="#1e5f9e" stroke-width="0.5"/>
  <text x="494" y="76" font-size="11" font-weight="500" fill="#1f2933">listas · por posição</text>
  <text x="494" y="94" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" fill="#1f2933">[['nome','email'],</text>
  <text x="494" y="108" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" fill="#1f2933"> ['Ana','ana@x']]</text>

  <rect x="480" y="182" width="160" height="76" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="0.5"/>
  <text x="494" y="200" font-size="11" font-weight="500" fill="#1f2933">dicionários · por nome</text>
  <text x="494" y="218" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" fill="#1f2933">{'nome':'Ana',</text>
  <text x="494" y="232" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" fill="#1f2933"> 'email':'ana@x'}</text>
  <text x="494" y="250" font-size="10" fill="#b45309">o cabeçalho virou as chaves</text>

  <text x="480" y="136" font-size="10" fill="#6b7280">cabeçalho = linha 0</text>
  <text x="480" y="286" font-size="10" fill="#6b7280">cabeçalho omitido</text>
  <text x="480" y="300" font-size="10" fill="#6b7280">dos resultados</text>

  <rect x="40" y="308" width="600" height="94" rx="10" fill="none" stroke="#9aa5b1" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="56" y="328" font-size="11" fill="#6b7280">módulo importável — a guarda decide o que roda</text>
  <text x="56" y="352" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#1f2933">if __name__ == "__main__":</text>

  <rect x="300" y="336" width="150" height="46" rx="8" fill="#eef4fa" stroke="#1e5f9e" stroke-width="0.5"/>
  <text x="375" y="354" font-size="10" fill="#1f2933" text-anchor="middle">rodado direto</text>
  <text x="375" y="370" font-size="10" fill="#1e5f9e" text-anchor="middle">o bloco roda</text>

  <rect x="470" y="336" width="152" height="46" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="0.5"/>
  <text x="546" y="354" font-size="10" fill="#1f2933" text-anchor="middle">importado</text>
  <text x="546" y="370" font-size="10" fill="#b45309" text-anchor="middle">o bloco NÃO roda</text>
</svg>
