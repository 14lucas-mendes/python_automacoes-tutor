<text x="1151.0" y="389.32" font-size="14" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace"></text>
<rect x="1174" y="364" width="38" height="40" rx="10" fill="#25262b" stroke="#868e96" stroke-width="2"/>
<text x="1193.0" y="389.32" font-size="14" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace"></text>
