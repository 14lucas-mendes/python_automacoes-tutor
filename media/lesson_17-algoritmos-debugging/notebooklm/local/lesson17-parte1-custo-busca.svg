<text x="1226.6" y="335.32" font-size="14" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">58</text>
<text x="1270" y="335" font-size="16" fill="#f1f3f5">passo 2: meio 6 → 40 &gt; 31 → fim = 5</text>
