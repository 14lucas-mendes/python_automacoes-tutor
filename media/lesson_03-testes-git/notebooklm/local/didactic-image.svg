<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" aria-labelledby="ttl desc" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="ttl">Os dois momentos em que o Python olha para o seu código</title>
  <desc id="desc">Diagrama de dois estágios. O estágio 1 é a análise, que confere a forma do código: se a forma é inválida, sai um SyntaxError e nada executa, sem traceback. Se a forma é válida, passa para o estágio 2, a execução, que confere os valores: se o nome não existe, sai NameError; se o valor não serve para a operação, sai TypeError, ambos com traceback. Uma seta extra mostra que uma função que termina sem return devolve None, e esse None chega ao chamador e provoca TypeError.</desc>
  <defs>
    <marker id="che2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="372" fill="#ffffff"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="500" fill="#1f2937">Os dois momentos em que o Python olha para o seu código</text>

  <rect x="40" y="48" width="290" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="185" y="68" text-anchor="middle" font-size="13" font-weight="500" fill="#1f2937">1 — ANÁLISE</text>
  <text x="185" y="85" text-anchor="middle" font-size="11" fill="#475569">antes de o programa rodar</text>

  <text x="48" y="120" font-size="11" fill="#475569">Confere a forma do código: se as palavras</text>
  <text x="48" y="137" font-size="11" fill="#475569">existem e se a gramática fecha.</text>

  <rect x="40" y="156" width="290" height="68" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="0.5"/>
  <text x="56" y="178" font-size="12" font-weight="500" fill="#b45309">SyntaxError: invalid syntax</text>
  <text x="56" y="198" font-size="11" fill="#92400e">Nada foi executado.</text>
  <text x="56" y="215" font-size="11" fill="#92400e">Não aparece "Traceback".</text>

  <line x1="333" y1="71" x2="347" y2="71" stroke="#94a3b8" stroke-width="1" marker-end="url(#che2)"/>

  <rect x="350" y="48" width="290" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="495" y="68" text-anchor="middle" font-size="13" font-weight="500" fill="#1f2937">2 — EXECUÇÃO</text>
  <text x="495" y="85" text-anchor="middle" font-size="11" fill="#475569">só depois que a análise passa</text>

  <text x="358" y="120" font-size="11" fill="#475569">Roda o código de cima para baixo.</text>
  <text x="358" y="137" font-size="11" fill="#475569">Aqui os valores existem e contam.</text>

  <rect x="350" y="156" width="290" height="68" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="0.5"/>
  <text x="366" y="178" font-size="12" font-weight="500" fill="#1f2937">TypeError · NameError · ZeroDivisionError</text>
  <text x="366" y="198" font-size="11" fill="#475569">O código já estava rodando.</text>
  <text x="366" y="215" font-size="11" fill="#475569">Traz "Traceback (most recent call last)".</text>

  <rect x="40" y="248" width="600" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="56" y="270" font-size="11" fill="#1f2937">A execução só começa se a análise aprovar.</text>
  <text x="56" y="286" font-size="11" fill="#475569">Um SyntaxError em qualquer linha impede que as outras rodem.</text>

  <rect x="40" y="306" width="600" height="46" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="0.5"/>
  <text x="56" y="328" font-size="11" font-weight="500" fill="#b45309">Origem silenciosa de TypeError: função que termina sem `return`</text>
  <text x="56" y="344" font-size="11" fill="#92400e">O cálculo acontece, mas quem chamou recebe None — e None é um valor, do tipo NoneType.</text>
</svg>
