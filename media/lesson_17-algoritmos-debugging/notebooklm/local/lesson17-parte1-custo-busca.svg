<text x="1142.6" y="335.32" font-size="14" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">40</text>
<rect x="1174" y="310" width="38" height="40" rx="10" fill="#15283a" stroke="#4dabf7" stroke-width="2"/>
