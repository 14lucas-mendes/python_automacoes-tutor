<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" width="1800" height="880" role="img" aria-labelledby="t d" font-family="Segoe Print, Comic Sans MS, Virgil, sans-serif">
<title id="t">lesson_17 · parte 1: custo em passos e busca binária</title>
<desc id="d">À esquerda, os quatro custos (constante, logarítmico, linear, quadrático) com exemplo e passos para 1.000 e 2.000 itens. À direita, a busca binária procurando 31 em uma lista de 9 preços ordenados, em 3 passos, com os marcadores inicio, fim e meio; depois a busca por 20, que não existe, as regras do meio e um aviso sobre lista fora de ordem. Embaixo, uma pergunta de recuperação.</desc>
<rect width="1800" height="880" fill="#121212"/>
<text x="40" y="52" font-size="32" fill="#f1f3f5" font-weight="700">lesson_17 · Parte 1 — custo em passos e busca binária</text>
<text x="40" y="86" font-size="18" fill="#adb5bd">Conte passos, não segundos. n = quantos itens a lista tem.</text>
<text x="40" y="138" font-size="20" fill="#f1f3f5" font-weight="700">Os quatro custos: o que acontece quando os dados dobram</text>
<rect x="40" y="160" width="780" height="96" rx="10" fill="#15283a" stroke="#4dabf7" stroke-width="2"/>
<text x="58" y="190" font-size="20" fill="#4dabf7" font-weight="700">constante · O(1)</text>
<text x="560" y="190" font-size="18" fill="#4dabf7" font-weight="700">dobrar: fica igual</text>
<text x="58" y="216" font-size="16" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">lista[0] · dicionario[chave]</text>
<text x="58" y="242" font-size="16" fill="#f1f3f5">1.000 itens → 1 passo · 2.000 → 1</text>
<rect x="40" y="268" width="780" height="96" rx="10" fill="#16301d" stroke="#69db7c" stroke-width="2"/>
<text x="58" y="298" font-size="20" fill="#69db7c" font-weight="700">logarítmico · O(log n)</text>
<text x="560" y="298" font-size="18" fill="#69db7c" font-weight="700">dobrar: +1 passo</text>
<text x="58" y="324" font-size="16" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">busca binária (lista ordenada)</text>
<text x="58" y="350" font-size="16" fill="#f1f3f5">1.000 → 10 passos · 2.000 → 11</text>
<rect x="40" y="376" width="780" height="96" rx="10" fill="#3a3115" stroke="#fcc419" stroke-width="2"/>
<text x="58" y="406" font-size="20" fill="#fcc419" font-weight="700">linear · O(n)</text>
<text x="560" y="406" font-size="18" fill="#fcc419" font-weight="700">dobrar: dobra</text>
<text x="58" y="432" font-size="16" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">busca linear · x in lista</text>
<text x="58" y="458" font-size="16" fill="#f1f3f5">1.000 → 1.000 passos · 2.000 → 2.000</text>
<rect x="40" y="484" width="780" height="96" rx="10" fill="#2a2140" stroke="#b197fc" stroke-width="2"/>
<text x="58" y="514" font-size="20" fill="#b197fc" font-weight="700">quadrático · O(n²)</text>
<text x="560" y="514" font-size="18" fill="#b197fc" font-weight="700">dobrar: quadruplica</text>
<text x="58" y="540" font-size="16" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">ordenação por seleção (parte 2)</text>
<text x="58" y="566" font-size="16" fill="#f1f3f5">1.000 → 499.500 · 2.000 → 1.999.000</text>
<rect x="40" y="600" width="780" height="64" rx="10" fill="#25262b" stroke="#868e96" stroke-width="2"/>
<text x="58" y="626" font-size="16" fill="#f1f3f5">Logaritmo aqui = quantas vezes dá para dividir por 2 até sobrar 1</text>
<text x="58" y="650" font-size="16" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">8 → 4 → 2 → 1: três divisões, então log₂ 8 = 3</text>
<rect x="40" y="682" width="780" height="50" rx="10" fill="#25262b" stroke="#868e96" stroke-width="2"/>
<text x="58" y="712" font-size="16" fill="#f1f3f5">Uma linha não é um passo: x in lista é um laço escondido.</text>
<text x="880" y="138" font-size="20" fill="#f1f3f5" font-weight="700">Busca binária: procurar 31 (lista ordenada)</text>
<rect x="880" y="160" width="86" height="52" rx="10" fill="#25262b" stroke="#868e96" stroke-width="2"/>
<text x="917.0" y="193.6" font-size="20" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">3</text>
