<text x="1235.0" y="389.32" font-size="14" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace"></text>
<text x="1270" y="389" font-size="16" fill="#f1f3f5">passo 3: meio 5 → 31 = 31 → achou em 3 passos</text>
<text x="880" y="438" font-size="14" fill="#adb5bd">azul = trecho que ainda pode ter o alvo · amarelo = meio · vazio = descartado</text>
<text x="880" y="472" font-size="16" fill="#f1f3f5">Procurar 20 (não existe): meios 4 → 1 → 2 → 3; então inicio 4 &gt; fim 3:</text>
<text x="880" y="496" font-size="16" fill="#f1f3f5">o trecho acabou, 20 não existe (4 passos).</text>
<rect x="880" y="520" width="880" height="122" rx="10" fill="#16301d" stroke="#69db7c" stroke-width="2"/>
<text x="898" y="548" font-size="18" fill="#69db7c" font-weight="700">Regras</text>
<text x="898" y="573" font-size="15" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">meio = (inicio + fim) // 2      // é divisão inteira: 7 // 2 = 3</text>
<text x="898" y="599" font-size="15" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">fim começa na última posição: len(lista) - 1, não len(lista)</text>
<text x="898" y="625" font-size="15" fill="#f1f3f5" font-family="Consolas, Cascadia Mono, monospace">meio &lt; alvo → inicio = meio + 1 · meio &gt; alvo → fim = meio - 1</text>
<rect x="880" y="660" width="880" height="72" rx="10" fill="#3a1a1a" stroke="#ff8787" stroke-width="2"/>
<text x="898" y="686" font-size="16" fill="#ff8787">Lista fora de ordem: a busca descarta a metade errada e diz</text>
<text x="898" y="712" font-size="16" fill="#ff8787">&quot;não existe&quot; sem erro nenhum. Ordene antes ou use busca linear.</text>
<rect x="40" y="770" width="1720" height="72" rx="10" fill="#3a3115" stroke="#fcc419" stroke-width="2"/>
<text x="60" y="798" font-size="18" fill="#f1f3f5">Pergunta para você, sem olhar: com 4.000 itens, quantos passos no pior caso fazem</text>
<text x="60" y="826" font-size="18" fill="#f1f3f5">a busca linear e a busca binária? E se a lista tivesse 8.000 itens?</text>
</svg>
