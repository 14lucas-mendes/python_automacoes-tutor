<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960" width="1800" height="960" role="img" aria-labelledby="t d" font-family="Segoe Print, Comic Sans MS, Virgil, sans-serif">
<title id="t">lesson_17 · parte 2: ordenação</title>
<desc id="d">À esquerda, o rastreio da ordenação por seleção em [5, 2, 9, 1, 6], volta a volta, com o trecho ordenado em verde e a troca de cada volta, o total de 10 comparações, a fórmula n vezes n menos 1 sobre 2 e por que dobrar os dados quadruplica o trabalho. À direita, sorted contra .sort(), um exemplo que imprime None e a lista ordenada, key e reverse com estabilidade, e três erros comuns. Embaixo, uma pergunta de recuperação.</desc>
<rect width="1800" height="960" fill="#121212"/>
<text x="40" y="52" font-size="32" fill="#f1f3f5" font-weight="700">lesson_17 · Parte 2 — ordenação</text>
<text x="40" y="86" font-size="18" fill="#adb5bd">Seleção: a cada volta, ache o menor do trecho que falta e troque com o primeiro desse trecho.</text>
